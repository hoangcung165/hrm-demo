name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Gradle test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write   # posts the evidence comment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Integration tests start PostgreSQL through Testcontainers (Docker is preinstalled on the runner).
      - run: ./gradlew test --console=plain

      # The load test of the Nguồn lực views (ResourceLoadIT) writes its timings here.
      - name: Resource load test timings
        if: always()
        run: |
          if [ -f backend/build/reports/resource-load.txt ]; then
            cat backend/build/reports/resource-load.txt
            { echo '### Resource load test'; echo '```'; cat backend/build/reports/resource-load.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The load test of the Lịch ca (ShiftCalendarLoadIT) writes its timings here.
      - name: Shift calendar load test timings
        if: always()
        run: |
          if [ -f backend/build/reports/shift-calendar-load.txt ]; then
            cat backend/build/reports/shift-calendar-load.txt
            { echo '### Shift calendar load test'; echo '```'; cat backend/build/reports/shift-calendar-load.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post evidence on the PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "## CI evidence for ${HEAD_SHA:0:7}"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            python3 .github/scripts/test-report.py
          } > evidence.md
          gh pr comment "$PR" --body-file evidence.md

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/

  web:
    name: Web (Vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Builds the Docker image, starts the whole system with docker compose (the same command a person uses),
  # then signs in, changes, forgets and resets the password in a real browser, walks the org structure screens,
  # and walks the API with curl.
  # Results are posted on the PR; screenshots are pushed to the `evidence` branch (never merged).
  e2e:
    name: E2E (docker compose, real browser)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write        # pushes screenshots to the evidence branch
      pull-requests: write   # posts the evidence comment
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The base commit too: the evidence shows only the flows this PR changed.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: docker compose up --build
        run: |
          docker compose up --build -d 2>&1 | tail -n 40
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://localhost:8080/actuator/health && break; sleep 2; done
          curl -fsS http://localhost:8080/actuator/health
          docker compose ps
      - name: Run the auth flow in Chromium against http://localhost:8080
        id: flow
        working-directory: web
        env:
          BASE_URL: http://localhost:8080
          IMG_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/evidence/pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node e2e/auth-flow.mjs
      - name: Run the org structure flow in Chromium against http://localhost:8080
        id: org
        working-directory: web
        env:
          BASE_URL: http://localhost:8080
          IMG_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/evidence/pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}
          # The auth flow above ends with this Admin password.
          HRM_ADMIN_PASSWORD: reset-password-2
        run: node e2e/org-flow.mjs
      - name: Run the accounts flow in Chromium against http://localhost:8080
        id: accounts
        working-directory: web
        env:
          BASE_URL: http://localhost:8080
          IMG_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/evidence/pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}
          # The auth flow above ends with this Admin password.
          HRM_ADMIN_PASSWORD: reset-password-2
        run: node e2e/accounts-flow.mjs
      - name: Run the roles flow in Chromium against http://localhost:8080
        id: roles
        working-directory: web
        env:
          BASE_URL: http://localhost:8080
          IMG_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/evidence/pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}
          # The auth flow above ends with this Admin password.
          HRM_ADMIN_PASSWORD: reset-password-2
        run: node e2e/roles-flow.mjs
      - name: Run the Demo as… flow in Chromium against http://localhost:8080
        id: demo
        working-directory: web
        env:
          BASE_URL: http://localhost:8080
          IMG_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/evidence/pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}
          # The auth flow above ends with this Admin password.
          HRM_ADMIN_PASSWORD: reset-password-2
        run: node e2e/demo-flow.mjs
      - name: Run the catalogs flow in Chromium against http://localhost:8080
        id: catalogs
        working-directory: web
        env:
          BASE_URL: http://localhost:8080
          IMG_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/evidence/pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}
          # The auth flow above ends with this Admin password.
          HRM_ADMIN_PASSWORD: reset-password-2
        run: node e2e/catalogs-flow.mjs
      - name: Run the employees flow in Chromium against http://localhost:8080
        id: employees
        working-directory: web
        env:
          BASE_URL: http://localhost:8080
          IMG_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/evidence/pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}
          # The auth flow above ends with this Admin password.
          HRM_ADMIN_PASSWORD: reset-password-2
        run: node e2e/employees-flow.mjs
      - name: Run the contracts tab flow in Chromium against http://localhost:8080
        id: contracts
        working-directory: web
        env:
          BASE_URL: http://localhost:8080
          IMG_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/evidence/pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}
          HRM_ADMIN_PASSWORD: reset-password-2
        run: node e2e/contracts-flow.mjs
      - name: Run the approval inbox flow in Chromium against http://localhost:8080
        id: approvals
        working-directory: web
        env:
          BASE_URL: http://localhost:8080
          IMG_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/evidence/pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}
          # The auth flow above ends with this Admin password.
          HRM_ADMIN_PASSWORD: reset-password-2
        run: node e2e/approvals-flow.mjs
      - name: Run the projects flow in Chromium against http://localhost:8080
        id: projects
        working-directory: web
        env:
          BASE_URL: http://localhost:8080
          IMG_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/evidence/pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}
          HRM_ADMIN_PASSWORD: reset-password-2
        run: node e2e/projects-flow.mjs
      - name: Run the resources flow in Chromium against http://localhost:8080
        id: resources
        working-directory: web
        env:
          BASE_URL: http://localhost:8080
          IMG_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/evidence/pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}
          HRM_ADMIN_PASSWORD: reset-password-2
        run: node e2e/resources-flow.mjs
      - name: Run the audit log flow in Chromium against http://localhost:8080
        id: audit
        working-directory: web
        env:
          BASE_URL: http://localhost:8080
          IMG_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/evidence/pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}
          HRM_ADMIN_PASSWORD: reset-password-2
        run: node e2e/audit-flow.mjs
      - name: Run the leave flow in Chromium against http://localhost:8080
        id: leave
        working-directory: web
        env:
          BASE_URL: http://localhost:8080
          IMG_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/evidence/pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}
          HRM_ADMIN_PASSWORD: reset-password-2
        run: node e2e/leave-flow.mjs
      - name: Auth API smoke (curl)
        id: smoke
        env:
          MAILPIT_URL: http://localhost:8025
          # The browser flow above ends with this Admin password.
          HRM_ADMIN_PASSWORD: reset-password-2
        run: |
          curl -fsS -X DELETE "$MAILPIT_URL/api/v1/messages" > /dev/null
          DB_CONTAINER="$(docker compose ps -q db)" bash .github/scripts/auth-smoke.sh > smoke.md
          tail -n 3 smoke.md
      - name: Publish screenshots and comment on the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## E2E evidence for ${HEAD_SHA:0:7}"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Stack: \`docker compose up --build\` (app image, PostgreSQL, Mailpit), app on http://localhost:8080."
            echo
            # Every flow ran; only those whose area this PR changed (or that failed) show their steps and screenshots.
            git diff --name-only "${{ github.event.pull_request.base.sha }}...$HEAD_SHA" > changed-files.txt
            OUTCOME_AUTH="${{ steps.flow.outcome }}" OUTCOME_ORG="${{ steps.org.outcome }}" \
              OUTCOME_ACCOUNTS="${{ steps.accounts.outcome }}" OUTCOME_ROLES="${{ steps.roles.outcome }}" \
              OUTCOME_DEMO="${{ steps.demo.outcome }}" OUTCOME_CATALOGS="${{ steps.catalogs.outcome }}" \
              OUTCOME_EMPLOYEES="${{ steps.employees.outcome }}" OUTCOME_CONTRACTS="${{ steps.contracts.outcome }}" OUTCOME_APPROVALS="${{ steps.approvals.outcome }}" \
              OUTCOME_PROJECTS="${{ steps.projects.outcome }}" OUTCOME_RESOURCES="${{ steps.resources.outcome }}" \
              OUTCOME_AUDIT="${{ steps.audit.outcome }}" OUTCOME_LEAVE="${{ steps.leave.outcome }}" \
              python3 .github/scripts/e2e-evidence.py changed-files.txt web/e2e-out
            echo
            if [ -s smoke.md ]; then echo "<details><summary>API transcript (curl)</summary>"; echo; cat smoke.md; echo; echo "</details>"; fi
            if [ "${{ steps.flow.outcome }}" != "success" ] || [ "${{ steps.org.outcome }}" != "success" ] || [ "${{ steps.accounts.outcome }}" != "success" ] || [ "${{ steps.roles.outcome }}" != "success" ] || [ "${{ steps.demo.outcome }}" != "success" ] || [ "${{ steps.catalogs.outcome }}" != "success" ] || [ "${{ steps.employees.outcome }}" != "success" ] || [ "${{ steps.contracts.outcome }}" != "success" ] || [ "${{ steps.approvals.outcome }}" != "success" ] || [ "${{ steps.projects.outcome }}" != "success" ] || [ "${{ steps.resources.outcome }}" != "success" ] || [ "${{ steps.audit.outcome }}" != "success" ] || [ "${{ steps.leave.outcome }}" != "success" ] || [ "${{ steps.smoke.outcome }}" != "success" ]; then
              echo; echo "App log (last 60 lines):"; echo; echo '```'; docker compose logs --no-color --tail 60 app 2>&1; echo '```'
            fi
          } > evidence.md
          if ls web/e2e-out/*.png > /dev/null 2>&1; then
            git clone --quiet --depth 1 --branch evidence \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" evidence-branch
            git -C evidence-branch config user.name "github-actions[bot]"
            git -C evidence-branch config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            mkdir -p "evidence-branch/pr-$PR/$HEAD_SHA"
            cp web/e2e-out/*.png "evidence-branch/pr-$PR/$HEAD_SHA/"
            git -C evidence-branch add -A
            git -C evidence-branch commit --quiet -m "Evidence: E2E screenshots for PR #$PR (${HEAD_SHA:0:7})"
            # Parallel PR runs publish separate directories on the same evidence branch.
            # Rebase our commit when another run pushed first, and retry rather than failing a green E2E.
            for attempt in 1 2 3 4 5; do
              if git -C evidence-branch push --quiet origin evidence; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Could not publish evidence after 5 retries" >&2
                exit 1
              fi
              git -C evidence-branch pull --rebase --quiet origin evidence
              sleep "$((attempt * 2))"
            done
          fi
          gh pr comment "$PR" --body-file evidence.md
