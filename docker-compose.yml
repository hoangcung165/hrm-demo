# Whole system:      docker compose up --build   → http://localhost:8080 (mail: http://localhost:8025)
# Dev (hot reload):  docker compose up db mail   → then bootRun + npm run dev, see AGENTS.md "Build & test"
# Values below are local defaults; override them in a .env file (see .env.example).
services:
  app:
    build: .
    ports:
      - "${HRM_APP_PORT:-8080}:8080"
    environment:
      HRM_DB_URL: jdbc:postgresql://db:5432/hrm
      HRM_DB_USER: hrm
      HRM_DB_PASSWORD: hrm
      HRM_MAIL_HOST: mail
      HRM_MAIL_PORT: "1025"
      HRM_MAIL_FROM: ${HRM_MAIL_FROM:-no-reply@hrm.local}
      # Links in emails point at the app as the browser sees it.
      HRM_APP_URL: ${HRM_APP_URL:-http://localhost:8080}
      # Local-only defaults. Set real values in .env for any shared or demo machine.
      HRM_JWT_SECRET: ${HRM_JWT_SECRET:-local-compose-only-jwt-secret-0123456789abcdef}
      HRM_ADMIN_EMAIL: ${HRM_ADMIN_EMAIL:-admin@hrm.local}
      HRM_ADMIN_PASSWORD: ${HRM_ADMIN_PASSWORD:-admin12345}
      # Plain HTTP on localhost: the refresh cookie cannot be Secure. Set true behind HTTPS.
      HRM_COOKIE_SECURE: ${HRM_COOKIE_SECURE:-false}
      HRM_REFRESH_REUSE_GRACE: ${HRM_REFRESH_REUSE_GRACE:-10s}
      # A fresh local database starts with a fictional company and org tree. Never on for real data.
      HRM_EXAMPLE_DATA: ${HRM_EXAMPLE_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hrm
      POSTGRES_USER: hrm
      POSTGRES_PASSWORD: hrm
    ports:
      - "${HRM_DB_PORT:-5432}:5432"   # set HRM_DB_PORT if 5432 is taken
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrm -d hrm"]
      interval: 5s
      retries: 10

  mail:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI xem mail

volumes:
  db-data:
