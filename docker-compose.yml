# Chạy local: docker compose up db mail
# Service app (toàn hệ thống bằng một lệnh) thêm ở HRM-01/INT-1.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hrm
      POSTGRES_USER: hrm
      POSTGRES_PASSWORD: hrm
    ports:
      - "${HRM_DB_PORT:-5432}:5432"   # đổi HRM_DB_PORT nếu máy đã có Postgres chiếm 5432
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrm -d hrm"]
      interval: 5s
      retries: 10

  mail:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI xem mail

volumes:
  db-data:
