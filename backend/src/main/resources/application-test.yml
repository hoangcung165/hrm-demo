spring:
  datasource:
    # Used only when HRM_TEST_DB_URL is set; otherwise Testcontainers supplies the connection
    # (TestcontainersConfiguration).
    url: ${HRM_TEST_DB_URL:jdbc:postgresql://localhost:5432/hrm}
    username: ${HRM_TEST_DB_USER:hrm}
    password: ${HRM_TEST_DB_PASSWORD:hrm}
  mail:
    # GreenMail (ServerSetupTest.SMTP) in integration tests.
    host: localhost
    port: 3025
  flyway:
    # Docker on macOS (colima) may take a few seconds to forward container ports.
    connect-retries: 10

hrm:
  auth:
    jwt-secret: test-only-jwt-secret-0123456789-abcdefghij
    # Short, so AuthApiIT can wait it out.
    refresh-reuse-grace: 2s
  admin:
    email: admin@hrm.test
    password: test-admin-password
