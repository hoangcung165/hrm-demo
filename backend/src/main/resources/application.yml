spring:
  application:
    name: hrm
  datasource:
    url: ${HRM_DB_URL:jdbc:postgresql://localhost:5432/hrm}
    username: ${HRM_DB_USER:hrm}
    password: ${HRM_DB_PASSWORD:hrm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

hrm:
  auth:
    # HS256 signing key, at least 32 characters. Required outside the dev profile.
    jwt-secret: ${HRM_JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    cookie-secure: ${HRM_COOKIE_SECURE:true}
  admin:
    # First Admin Account, created only while the account table is empty.
    email: ${HRM_ADMIN_EMAIL:}
    password: ${HRM_ADMIN_PASSWORD:}
