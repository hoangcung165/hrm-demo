spring:
  application:
    name: hrm
  datasource:
    url: ${HRM_DB_URL:jdbc:postgresql://localhost:5432/hrm}
    username: ${HRM_DB_USER:hrm}
    password: ${HRM_DB_PASSWORD:hrm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      # Batched inserts, e.g. the Excel import of up to 1,000 Employees in one transaction. Ids are UUIDs made in
      # the application, so Hibernate can batch them.
      hibernate.jdbc.batch_size: 100
      hibernate.order_inserts: true
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Parse an upload when its controller asks for the file, so a size failure reaches that controller's
      # error handler and gets the feature's own error code (see CompanyController).
      resolve-lazily: true
      # Largest upload: the employee Excel import (EmployeeImportService.MAX_FILE_BYTES, 5 MB). Each endpoint
      # also checks its own limit (the logo 1 MB), so a file under this one still gets the feature's own code.
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    # Defaults match Mailpit from docker compose (web UI on http://localhost:8025).
    host: ${HRM_MAIL_HOST:localhost}
    port: ${HRM_MAIL_PORT:1025}
    username: ${HRM_MAIL_USER:}
    password: ${HRM_MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # A mail server outage must not take the app out of the load balancer.
      enabled: false

hrm:
  # Public URL of the web app, used in links inside emails.
  app-url: ${HRM_APP_URL:http://localhost:5173}
  mail:
    from: ${HRM_MAIL_FROM:no-reply@hrm.local}
  auth:
    # HS256 signing key, at least 32 characters. Required outside the dev profile.
    jwt-secret: ${HRM_JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    # A refresh token may be exchanged again this long after its first use (fast double reload, two tabs).
    refresh-reuse-grace: ${HRM_REFRESH_REUSE_GRACE:10s}
    password-reset-ttl: 30m
    cookie-secure: ${HRM_COOKIE_SECURE:true}
  admin:
    # First Admin Account, created only while the account table is empty.
    email: ${HRM_ADMIN_EMAIL:}
    password: ${HRM_ADMIN_PASSWORD:}
    # Name shown for that Account, at most 100 characters.
    full-name: ${HRM_ADMIN_FULL_NAME:Quản trị viên}
  demo-personas:
    # "Demo as…": seeds one persona Account per role. Any signed-in Account can then act as a persona, the Admin
    # persona included, so this is for demo data only. Off: leftover persona Accounts are locked at startup.
    enabled: ${HRM_DEMO_PERSONAS:false}
  example-data:
    # Opt-in fictional company and org tree for local and dev runs (ExampleDataSeeder). Keep off for real data.
    enabled: ${HRM_EXAMPLE_DATA:false}
  scheduling:
    # Background jobs, such as the Tự duyệt of approval requests (ApprovalAutoApproveJob).
    enabled: ${HRM_SCHEDULING:true}
  approval:
    auto-approve:
      # How often waiting levels whose delay has passed approve themselves. Delays are whole days, so a few minutes
      # late is fine; several app instances may run it at once.
      interval: PT5M
      initial-delay: PT1M
  employees:
    export:
      # Most Employees one Excel export holds; a larger result is refused (export.too_many_rows), never cut.
      max-rows: 5000
